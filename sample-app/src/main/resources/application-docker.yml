spring:
  application:
    name: sample-app
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# 추적은 OpenTelemetry Java Agent가 처리합니다 (Spring Boot 자동 구성 아님)
# OTEL_* 환경 변수는 docker-compose.yml을 참조하세요

# AOP 기반 내부 메서드 자동 추적 활성화
observability:
  tracing:
    aop:
      enabled: true

logging:
  level:
    root: INFO
    com.example: DEBUG
    # OTel Agent 디버그 로깅 (선택 사항)
    io.opentelemetry: INFO
